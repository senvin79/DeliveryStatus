[project]
name = "story-status"
version = "1.0.0"
description = "Consolidate Jira story details and GitHub PR status via MCP, then summarize with an LLM."
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32.0",
  "huggingface_hub>=0.24.0",
]

[project.scripts]
story-status = "story_status.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
